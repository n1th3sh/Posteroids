spring.application.name=posteroids
spring.config.import=optional:file:.env[.properties],optional:file:./posteroids/.env[.properties]

server.port=${PORT:8080}
server.servlet.context-path=/api


spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Existing Neon databases already contain the auth and catalog schema. Baseline
# them at version 0 so additive V1 migrations can be applied without rebuilding it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Auth secrets must be supplied by the deployment environment. Generate a 256-bit+ random JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
app.email.verification-expiration-minutes=${EMAIL_CODE_EXPIRATION_MINUTES:10}
app.email.console-mode=${EMAIL_CONSOLE_MODE:false}

# Configure SMTP to send verification codes. In production use a transactional mail provider.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.email.from=${MAIL_FROM:no-reply@posteroids.local}
